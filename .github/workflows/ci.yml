name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, Vet & Test
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The Vulnetix CLI and vdb-site edit customer manifests through this module,
      # so the golden files in testdata/golden are the contract: a changed golden
      # file is a changed edit to someone's file and needs a reason in the commit.
      - name: Test
        run: go test -race -count=1 ./...
